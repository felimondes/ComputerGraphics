<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>Computer Graphics Worksheets</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", sans-serif;
            background: #101827;
            color: #edf2f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        header,
        main {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
        }

        header {
            padding: 48px 0 28px;
        }

        h1,
        h2,
        p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 10px;
            font-size: clamp(2rem, 5vw, 3.25rem);
        }

        header p {
            margin-bottom: 0;
            color: #b7c4d6;
        }

        .worksheet-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .worksheet-list a {
            display: block;
            height: 100%;
            padding: 20px;
            border: 1px solid #34445b;
            border-radius: 10px;
            background: #182436;
            color: inherit;
            text-decoration: none;
        }

        .worksheet-list a:hover {
            border-color: #67e8f9;
            background: #1c293b;
        }

        .worksheet-list a:focus-visible {
            outline: 3px solid #67e8f9;
            outline-offset: 3px;
        }

        .worksheet-list h2 {
            margin-bottom: 8px;
            font-size: 1.15rem;
        }

        .worksheet-list p {
            margin-bottom: 0;
            color: #b7c4d6;
        }
    </style>
</head>
<body>
    <header>
        <h1>Computer Graphics</h1>
        <p>Choose a week or the project to browse its worksheets.</p>
    </header>
    <main>
        <nav aria-label="Weeks and project">
            <ul class="worksheet-list" id="worksheet-list"></ul>
        </nav>
    </main>
    <script type="module">
        import { worksheets } from "./worksheets.js";

        const list = document.getElementById("worksheet-list");
        for (const worksheet of worksheets) {
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = `week.html?week=${encodeURIComponent(worksheet.id)}`;

            const title = document.createElement("h2");
            title.textContent = worksheet.title;
            const partCount = document.createElement("p");
            partCount.textContent = `${worksheet.parts.length} ${worksheet.parts.length === 1 ? "part" : "parts"}`;

            link.append(title, partCount);
            item.append(link);
            list.append(item);
        }
    </script>
</body>
</html>
