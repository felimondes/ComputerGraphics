<!DOCTYPE html>
<html>

<head>
    <title>Project Part 5 - Sweep and Prune narrow phase</title>

    <style>
        .workspace {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .canvas-container {
            position: relative;
            width: 512px;
            max-width: 100%;
        }

        #my-canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .fps-counter {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 8px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            font: 14px sans-serif;
            pointer-events: none;
        }

        .controls {
            width: 280px;
            flex: 0 0 280px;
        }

        .control-row input {
            display: block;
            width: 100%;
        }

        @media (max-width: 820px) {
            .workspace {
                flex-direction: column;
            }

            .controls {
                width: min(512px, 100%);
                flex-basis: auto;
            }
        }
    </style>

    <script type="text/javascript" src="../../utility/MV.js"></script>
    <script type="module" src="p.js"></script>
</head>

<body>
    <script id="wgsl" type="x-shader" src="p.wgsl"></script>
    <div class="workspace">

        <div class="canvas-container">
            <canvas id="my-canvas" width="512" height="512">
                Please use a browser that supports HTML5 canvas.
            </canvas>
            <div class="fps-counter">FPS: <span id="fps">--</span></div>
        </div>

        <aside class="controls">
            <div id="spawning"></div>
            <div id="bounds"></div>
            <div id="scene"></div>
             <div id="camera"></div>
            <div id="lighting"></div>
        </aside>
    </div>
</body>
</html>
