<!DOCTYPE html>
<html>

<head>
    <title>My Page</title>
    <style>
        .texture-demo {
            display: flex;
            align-items: flex-start;
            gap: 24px;
        }

        #texture-controls table {
            border-collapse: collapse;
        }

        #texture-controls th,
        #texture-controls td {
            padding: 6px 8px;
            text-align: left;
        }

        #texture-controls th {
            font-weight: normal;
        }
    </style>
    <script type="text/javascript" src="../../utility/MV.js"></script>
    <script type="module" src="p.js"></script>
</head>

<body>

    <script id="wgsl" type="x-shader" src="p.wgsl"></script>
    <div class="texture-demo">
        <canvas id="my-canvas" width="512" height="512">
            Please use a browser that supports HTML5 canvas.
        </canvas>

        <form id="texture-controls">
            <table>
                <tbody>
                    <tr>
                        <th scope="row"><label for="wrap-mode">Wrapping</label></th>
                        <td>
                            <select id="wrap-mode">
                                <option value="repeat">Repeat</option>
                                <option value="clamp-to-edge">Clamp to edge</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="min-filter">Minification filter</label></th>
                        <td>
                            <select id="min-filter">
                                <option value="nearest">Nearest</option>
                                <option value="linear">Linear</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="mag-filter">Magnification filter</label></th>
                        <td>
                            <select id="mag-filter">
                                <option value="nearest">Nearest</option>
                                <option value="linear">Linear</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="mipmap-filter">Mipmap filter</label></th>
                        <td>
                            <select id="mipmap-filter">
                                <option value="nearest">Nearest</option>
                                <option value="linear">Linear</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="mipmap-enabled">Mipmapping</label></th>
                        <td><input id="mipmap-enabled" type="checkbox" checked></td>
                    </tr>
                </tbody>
            </table>
        </form>
    </div>
</body>

</html>
