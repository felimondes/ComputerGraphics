<!DOCTYPE html>
<html>

<head>
    <title>My Page</title>
    <style>
        .workspace {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        #my-canvas {
            display: block;
        }

        .controls {
            width: 220px;
            flex: 0 0 220px;
        }

        .controls button,
        .controls select {
            display: block;
            width: 100%;
            margin-bottom: 8px;
        }

        .controls label {
            display: block;
        }

        @media (max-width: 800px) {
            .workspace {
                flex-direction: column;
            }

            .controls {
                width: min(512px, 100%);
                flex-basis: auto;
            }
        }
    </style>
    <script type="text/javascript" src="../../utility/MV.js"></script>
    <script type="module" src="p.js"></script>
</head>

<body>
    <script id="wgsl" type="x-shader" src="p.wgsl"></script>
    <div class="workspace">
        <canvas id="my-canvas" width="512" height="512">
            Please use a browser that supports HTML5 canvas.
        </canvas>

        <aside class="controls">
            <button id="clear-button" type="button">Clear canvas</button>
            <button id="point-mode" type="button">Point mode</button>
            <button id="triangle-mode" type="button">Triangle mode</button>

            <label for="clear-color">Clear color:</label>
            <select id="clear-color">
                <option value="black" selected>Black</option>
                <option value="red">Red</option>
                <option value="yellow">Yellow</option>
                <option value="green">Green</option>
                <option value="blue">Blue</option>
                <option value="magenta">Magenta</option>
                <option value="cyan">Cyan</option>
                <option value="white">White</option>
                <option value="blueish">Funny Blue</option>
            </select>

            <label for="point-color">Point color:</label>
            <select id="point-color">
                <option value="black" selected>Black</option>
                <option value="red">Red</option>
                <option value="yellow">Yellow</option>
                <option value="green">Green</option>
                <option value="blue">Blue</option>
                <option value="magenta">Magenta</option>
                <option value="cyan">Cyan</option>
                <option value="white">White</option>
                <option value="blueish">Cornflower</option>
            </select>
        </aside>
    </div>
</body>

</html>
