<fieldset>
    <legend>Spawn objects</legend>
    <label for="spawn-shape">Object type:</label>
    <select id="spawn-shape"></select>
    <label for="object-count">Number of objects (1 to 100):</label>
    <input id="object-count" type="number" min="1" max="100" step="1" value="3" required>
    <button id="spawn-objects" type="button">Spawn</button>
</fieldset>
