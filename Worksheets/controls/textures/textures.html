<form id="texture-controls">
	<fieldset>
		<legend>Texture</legend>

		<div class="control-row">
			<label for="wrap-mode">Wrapping</label>
			<select id="wrap-mode">
				<option value="repeat">Repeat</option>
				<option value="clamp-to-edge">Clamp to edge</option>
			</select>
		</div>

		<div class="control-row">
			<label for="min-filter">Minification filter</label>
			<select id="min-filter">
				<option value="nearest">Nearest</option>
				<option value="linear">Linear</option>
			</select>
		</div>

		<div class="control-row">
			<label for="mag-filter">Magnification filter</label>
			<select id="mag-filter">
				<option value="nearest">Nearest</option>
				<option value="linear">Linear</option>
			</select>
		</div>

		<div class="control-row">
			<label for="mipmap-filter">Mipmap filter</label>
			<select id="mipmap-filter">
				<option value="nearest">Nearest</option>
				<option value="linear">Linear</option>
			</select>
		</div>

		<div class="control-row">
			<label for="mipmap-enabled">Mipmapping</label>
			<input id="mipmap-enabled" type="checkbox" checked>
		</div>
	</fieldset>
</form>
