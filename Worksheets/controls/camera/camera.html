<fieldset>
	<legend>Camera</legend>

	<div class="control-row">
		<label for="eyeX">Eye position X: <output data-slider-output="eyeX"></output></label>
		<input id="eyeX" data-slider-key="eyeX" type="range" min="-20" max="20" step="0.1" value="0">
	</div>

	<div class="control-row">
		<label for="eyeY">Eye position Y: <output data-slider-output="eyeY"></output></label>
		<input id="eyeY" data-slider-key="eyeY" type="range" min="-20" max="20" step="0.1" value="0">
	</div>

	<div class="control-row">
		<label for="eyeZ">Eye position Z: <output data-slider-output="eyeZ"></output></label>
		<input id="eyeZ" data-slider-key="eyeZ" type="range" min="-20" max="20" step="0.1" value="10">
	</div>

	<div class="control-row">
		<label for="mouseSensitivity">Mouse sensitivity: <output data-slider-output="mouseSensitivity"></output></label>
		<input id="mouseSensitivity" data-slider-key="mouseSensitivity" type="range" min="0.001" max="0.02" step="0.001" value="0.005">
	</div>

	<div class="control-row">
		<label for="orbitSpeed">Orbit speed: <output data-slider-output="orbitSpeed"></output></label>
		<input id="orbitSpeed" data-slider-key="orbitSpeed" type="range" min="0.1" max="5" step="0.1" value="1">
	</div>
</fieldset>

<button id="toggle-orbit" type="button">Start orbit</button>
