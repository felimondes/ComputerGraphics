<fieldset>
    <legend>Misc</legend>
    <div>
        <label>
            <input id="show-bounding-volumes" type="checkbox" checked>
            Show bounding spheres
        </label>
    </div>
    <div>
        <label>
            <input id="show-mesh-triangles" type="checkbox">
            Show mesh triangles
        </label>
    </div>
    <div>
        <label>
            <input id="show-obb-trees" type="checkbox">
            Show OBB trees
        </label>
    </div>
    <label>
        OBB tree level:
        <input id="obb-tree-level" type="number" min="0" max="100" value="0">
    </label>
</fieldset>
