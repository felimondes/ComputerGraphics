<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course notes</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
            color: #182436;
            background: #fff;
        }

        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px clamp(16px, 4vw, 40px) 48px;
            line-height: 1.65;
        }

        h1,
        h2,
        h3,
        h4 {
            line-height: 1.25;
        }

        h1 {
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #d5dde7;
        }

        h2,
        h3,
        h4 {
            margin-top: 1.6em;
        }

        p,
        ol,
        ul {
            margin: 0 0 1em;
        }

        code,
        pre {
            font-family: Consolas, "Courier New", monospace;
        }

        code {
            padding: 0.12em 0.35em;
            border-radius: 4px;
            background: #edf2f7;
        }

        .math-display {
            display: block;
            overflow-x: auto;
            margin: 1.25em 0;
            padding: 14px 16px;
            border-radius: 6px;
            background: #f1f5f9;
            text-align: center;
            font-size: 1.15rem;
        }

        .math-display math {
            min-width: max-content;
        }

        .error {
            padding: 14px;
            border-left: 4px solid #b42318;
            background: #fef3f2;
            color: #7a271a;
        }
    </style>
</head>
<body>
    <main>
        <h1 id="document-title">Course notes</h1>
        <article id="document-content" aria-live="polite">Loading notes…</article>
    </main>
    <script>
        const documents = {
            "W3/p3/reflections.md": "Week 3 — Affine and Viewing Transformations",
            "W4/p6/reflections.md": "Week 4 — Shading and Lighting Reflections",
            "W5/p4.md": "Week 5 — Surface Normals and Mesh Smoothness",
        };

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
            })[character]);
        }

        function renderInline(text) {
            return escapeHtml(text)
                .replace(/`([^`]+)`/g, "<code>$1</code>")
                .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                .replace(/\*(.+?)\*/g, "<em>$1</em>");
        }

        function renderTex(expression) {
            const tokens = expression.match(/\\\\|\\[a-zA-Z]+|[{}_^&]|[A-Za-z]+|\d+(?:\.\d+)?|[^\s]/g) || [];
            const greek = {
                alpha: "α",
                theta: "θ",
                cot: "cot",
                cos: "cos",
                sin: "sin",
            };
            let position = 0;

            function tokenText(token) {
                return token.startsWith("\\") ? (greek[token.slice(1)] || token.slice(1)) : token;
            }

            function readGroupText() {
                if (tokens[position] !== "{") {
                    throw new Error("Expected a braced math argument.");
                }
                position++;
                let depth = 1;
                const value = [];
                while (position < tokens.length && depth > 0) {
                    const token = tokens[position++];
                    if (token === "{") {
                        depth++;
                        if (depth > 1) value.push(token);
                    } else if (token === "}") {
                        depth--;
                        if (depth > 0) value.push(token);
                    } else {
                        value.push(tokenText(token));
                    }
                }
                if (depth !== 0) {
                    throw new Error("Unclosed braced math argument.");
                }
                return value.join("");
            }

            function parseGroup() {
                if (tokens[position] !== "{") {
                    return parseAtom();
                }
                position++;
                const content = parseSequence(new Set(["}"]));
                if (tokens[position] !== "}") {
                    throw new Error("Unclosed math group.");
                }
                position++;
                return `<mrow>${content}</mrow>`;
            }

            function parseMatrix() {
                const rows = [];
                let cells = [];
                while (position < tokens.length) {
                    if (tokens[position] === "\\end") {
                        position++;
                        const environment = readGroupText();
                        if (environment !== "bmatrix") {
                            throw new Error(`Unsupported matrix environment: ${environment}`);
                        }
                        rows.push(cells);
                        return `<mrow><mo>[</mo><mtable columnalign="center">${rows
                            .map(row => `<mtr>${row.join("")}</mtr>`)
                            .join("")}</mtable><mo>]</mo></mrow>`;
                    }

                    const cell = parseSequence(new Set(["&", "\\\\", "\\end"]));
                    cells.push(`<mtd>${cell}</mtd>`);
                    if (tokens[position] === "&") {
                        position++;
                    } else if (tokens[position] === "\\\\") {
                        position++;
                        rows.push(cells);
                        cells = [];
                    } else if (tokens[position] !== "\\end") {
                        throw new Error("Unclosed math matrix.");
                    }
                }
                throw new Error("Unclosed math matrix.");
            }

            function parseAtom() {
                const token = tokens[position++];
                if (token === undefined) {
                    return "";
                }
                if (token === "{") {
                    position--;
                    return parseGroup();
                }
                if (token === "\\begin") {
                    const environment = readGroupText();
                    if (environment === "bmatrix") {
                        return parseMatrix();
                    }
                    throw new Error(`Unsupported math environment: ${environment}`);
                }
                if (token === "\\frac") {
                    return `<mfrac>${parseGroup()}${parseGroup()}</mfrac>`;
                }
                if (token === "\\operatorname" || token === "\\text") {
                    return `<mtext>${escapeHtml(readGroupText())}</mtext>`;
                }
                if (token.startsWith("\\")) {
                    const symbol = greek[token.slice(1)];
                    return symbol
                        ? `<mi${["cot", "cos", "sin"].includes(symbol) ? ' mathvariant="normal"' : ""}>${symbol}</mi>`
                        : `<mo>${escapeHtml(token.slice(1))}</mo>`;
                }
                if (/^[A-Za-z]+$/.test(token)) {
                    return `<mi>${escapeHtml(token)}</mi>`;
                }
                if (/^\d+(?:\.\d+)?$/.test(token)) {
                    return `<mn>${token}</mn>`;
                }
                const stretchy = token === "(" || token === ")" ? ' stretchy="false"' : "";
                return `<mo${stretchy}>${escapeHtml(token)}</mo>`;
            }

            function parseSequence(stops = new Set()) {
                const nodes = [];
                while (position < tokens.length && !stops.has(tokens[position])) {
                    let base = parseAtom();
                    let subscript = "";
                    let superscript = "";
                    while (tokens[position] === "_" || tokens[position] === "^") {
                        const script = tokens[position++];
                        const value = parseGroup();
                        if (script === "_") {
                            subscript = value;
                        } else {
                            superscript = value;
                        }
                    }
                    if (subscript && superscript) {
                        base = `<msubsup>${base}${subscript}${superscript}</msubsup>`;
                    } else if (subscript) {
                        base = `<msub>${base}${subscript}</msub>`;
                    } else if (superscript) {
                        base = `<msup>${base}${superscript}</msup>`;
                    }
                    nodes.push(base);
                }
                return nodes.join("");
            }

            return `<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow>${parseSequence()}</mrow></math>`;
        }

        function renderMarkdown(markdown) {
            const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
            const html = [];
            let paragraph = [];
            let listType = "";
            let math = [];
            let inMath = false;

            function flushParagraph() {
                if (paragraph.length) {
                    html.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
                    paragraph = [];
                }
            }

            function closeList() {
                if (listType) {
                    html.push(`</${listType}>`);
                    listType = "";
                }
            }

            for (const line of lines) {
                const trimmed = line.trim();

                if (inMath) {
                    if (trimmed === "$$") {
                        const expression = math.join("\n");
                        html.push(`<div class="math-display" role="math" aria-label="${escapeHtml(expression)}">${renderTex(expression)}</div>`);
                        math = [];
                        inMath = false;
                    } else {
                        math.push(line);
                    }
                    continue;
                }

                if (trimmed === "$$") {
                    flushParagraph();
                    closeList();
                    inMath = true;
                    continue;
                }

                if (!trimmed) {
                    flushParagraph();
                    closeList();
                    continue;
                }

                const heading = /^(#{1,6})\s+(.+)$/.exec(trimmed);
                if (heading) {
                    flushParagraph();
                    closeList();
                    const level = heading[1].length;
                    html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
                    continue;
                }

                const listItem = /^(\d+\.|[-*+])\s+(.+)$/.exec(trimmed);
                if (listItem) {
                    flushParagraph();
                    const nextListType = /^\d/.test(listItem[1]) ? "ol" : "ul";
                    if (listType !== nextListType) {
                        closeList();
                        listType = nextListType;
                        html.push(`<${listType}>`);
                    }
                    html.push(`<li>${renderInline(listItem[2])}</li>`);
                    continue;
                }

                closeList();
                paragraph.push(trimmed);
            }

            flushParagraph();
            closeList();
            if (inMath) {
                html.push(`<pre class="math">${escapeHtml(math.join("\n"))}</pre>`);
            }
            return html.join("\n");
        }

        async function loadDocument() {
            const file = new URLSearchParams(window.location.search).get("file");
            const title = documents[file];
            const titleElement = document.getElementById("document-title");
            const contentElement = document.getElementById("document-content");

            if (!title) {
                titleElement.textContent = "Notes unavailable";
                contentElement.className = "error";
                contentElement.textContent = "This notes page is not available.";
                return;
            }

            titleElement.textContent = title;
            document.title = title;

            try {
                const response = await fetch(file);
                if (!response.ok) {
                    throw new Error(`Could not load notes (${response.status}).`);
                }
                contentElement.innerHTML = renderMarkdown(await response.text());
            } catch (error) {
                contentElement.className = "error";
                contentElement.textContent = `Unable to load the notes. ${error.message}`;
            }
        }

        loadDocument();
    </script>
</body>
</html>
